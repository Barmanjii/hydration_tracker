name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run still in flight. Without this,
# a branch pushed three times queues three full runs and the first two are waste.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci rather than install: fails on a lockfile that does not match
      # package.json, instead of quietly resolving to something different.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # Separate from the job above so the check name stays honest and so the two
  # run in parallel rather than in sequence.
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # Deliberately fails only on critical, and always prints the full report.
  #
  # A gate on "high" would make main permanently red. As of this being written
  # the tree carries 18 advisories, all of them reached through expo and
  # react-native, and npm's suggested remedy is to downgrade to expo 53 and
  # react-native 0.72, which is backwards from the pinned versions and would
  # break the build. The underlying issues (an infinite loop in image-size's
  # ICNS parser, a missing bounds check in uuid) live in metro and the Expo CLI,
  # which run at bundle time on a developer machine and never ship to a device.
  #
  # So: critical blocks, everything else is reported and read by a human. If
  # that balance ever starts hiding something real, tighten it then.
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report all advisories
        run: npm audit || true

      - name: Fail on critical
        run: npm audit --audit-level=critical

  android:
    name: android debug build
    runs-on: ubuntu-latest
    # Measured at 6m55s on a cold cache, so this is a generous ceiling rather
    # than an expected duration. If a run ever approaches it, something is wrong.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No cache: gradle here. It resolves its cache key from gradle files at
      # checkout time, and android/ does not exist yet. The explicit cache
      # below runs after prebuild instead.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # android/ is generated, not committed. This is what makes a managed Expo
      # project buildable on a runner that has never seen it.
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      # Keyed on the lockfile: the generated gradle files are a function of the
      # installed Expo and React Native versions, so the lockfile is the honest
      # cache key even though it is not a gradle file.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # Downloadable from the pull request, so a build can be installed on a
      # real device without anyone building it locally.
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
