name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run still in flight. Without this,
# a branch pushed three times queues three full runs and the first two are waste.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci rather than install: fails on a lockfile that does not match
      # package.json, instead of quietly resolving to something different.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  android:
    name: android debug build
    runs-on: ubuntu-latest
    # Longer than the ten minute target because a cold Gradle build genuinely
    # takes it. The cache below is what keeps subsequent runs reasonable.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      # android/ is generated, not committed. This is what makes a managed Expo
      # project buildable on a runner that has never seen it.
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # Downloadable from the pull request, so a build can be installed on a
      # real device without anyone building it locally.
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
