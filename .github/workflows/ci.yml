name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run still in flight. Without this,
# a branch pushed three times queues three full runs and the first two are waste.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci rather than install: fails on a lockfile that does not match
      # package.json, instead of quietly resolving to something different.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint
